<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ZeroDown Store</title>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #60a5fa;
      --soft: #eff6ff;
      --background: #f8fafc;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --green: #16a34a;
    }

    body.green {
      --primary: #059669;
      --primary-dark: #047857;
      --accent: #34d399;
      --soft: #ecfdf5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--background);
      color: var(--text);
      line-height: 1.5;
      transition: background 0.4s ease;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       NAVBAR
    ========================= */

    header {
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      max-width: 1200px;
      min-height: 72px;
      margin: 0 auto;

      padding: 0 24px;

      display: flex;
      align-items: center;
      gap: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 21px;
      font-weight: 800;
      white-space: nowrap;
    }

    .brand-logo {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--accent)
        );

      color: white;
      font-weight: 900;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      font-size: 14px;
      color: #4b5563;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .search {
      position: relative;
      flex: 1;
      max-width: 380px;
      margin-left: auto;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      color: #9ca3af;
      font-size: 17px;
    }

    .search input {
      width: 100%;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: #f9fafb;

      padding: 11px 14px 11px 40px;

      outline: none;

      transition: 0.2s ease;
    }

    .search input:focus {
      background: white;
      border-color: var(--primary);

      box-shadow:
        0 0 0 4px var(--soft);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);
      background: white;

      border-radius: 11px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .icon-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* =========================
       LIVE BADGE
    ========================= */

    .live-badge {
      height: 34px;

      display: flex;
      align-items: center;
      gap: 7px;

      padding: 0 11px;

      border-radius: 999px;

      background: #f0fdf4;
      border: 1px solid #bbf7d0;

      color: #15803d;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 0.3px;

      white-space: nowrap;

      transition: 0.3s ease;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: var(--green);

      animation: livePulse 1.8s infinite;
    }

    @keyframes livePulse {
      0% {
        box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.35);
      }

      70% {
        box-shadow: 0 0 0 6px rgba(22, 163, 74, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(22, 163, 74, 0);
      }
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1200px;
      margin: 0 auto;

      padding: 36px 24px 70px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 430px;

      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;

      padding: 50px;

      border-radius: 28px;

      overflow: hidden;
      position: relative;

      background:
        linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary),
          var(--accent)
        );

      color: white;

      transition:
        background 0.5s ease,
        box-shadow 0.4s ease;
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 400px;
      height: 400px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,0.14);

      right: -100px;
      top: -120px;
    }

    .hero::after {
      content: "";

      position: absolute;

      width: 250px;
      height: 250px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,0.12);

      right: 70px;
      bottom: -150px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-label {
      display: inline-block;

      padding: 7px 11px;

      border-radius: 999px;

      background: rgba(255,255,255,0.14);

      border: 1px solid rgba(255,255,255,0.18);

      font-size: 11px;
      font-weight: 700;

      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(38px, 5vw, 60px);

      line-height: 1.02;

      letter-spacing: -2.5px;

      max-width: 600px;
    }

    .hero p {
      margin-top: 18px;

      max-width: 500px;

      color: rgba(255,255,255,0.82);

      font-size: 15px;

      line-height: 1.7;
    }

    .shop-btn {
      display: inline-block;

      margin-top: 26px;

      padding: 13px 18px;

      border-radius: 12px;

      background: white;
      color: var(--primary-dark);

      font-size: 13px;
      font-weight: 800;

      transition: 0.2s ease;
    }

    .shop-btn:hover {
      transform: translateY(-2px);
    }

    /* HERO PRODUCT */

    .hero-product {
      position: relative;
      z-index: 2;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-product-box {
      width: 260px;
      height: 260px;

      border-radius: 34px;

      display: grid;
      place-items: center;

      font-size: 100px;

      background: rgba(255,255,255,0.13);

      border: 1px solid rgba(255,255,255,0.18);

      backdrop-filter: blur(12px);

      transform: rotate(-6deg);

      box-shadow:
        0 30px 60px rgba(0,0,0,0.12);
    }

    /* =========================
       PRODUCTS
    ========================= */

    .section {
      margin-top: 48px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: end;

      gap: 20px;

      margin-bottom: 20px;
    }

    .section-header h2 {
      font-size: 27px;
      letter-spacing: -0.8px;
    }

    .section-header p {
      color: var(--muted);

      font-size: 13px;

      margin-top: 4px;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-btn {
      border: 1px solid var(--border);

      background: white;

      padding: 8px 13px;

      border-radius: 999px;

      font-size: 12px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .category-btn:hover,
    .category-btn.active {
      background: var(--soft);
      border-color: transparent;
      color: var(--primary-dark);
      font-weight: 700;
    }

    .products {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 18px;
    }

    .product-card {
      background: white;

      border: 1px solid var(--border);

      border-radius: 18px;

      overflow: hidden;

      transition: 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);

      box-shadow:
        0 16px 35px rgba(15,23,42,0.08);
    }

    .product-image {
      height: 215px;

      display: grid;
      place-items: center;

      position: relative;

      background:
        linear-gradient(
          145deg,
          var(--soft),
          #ffffff
        );

      font-size: 68px;
    }

    .product-badge {
      position: absolute;

      top: 12px;
      left: 12px;

      padding: 5px 8px;

      background: white;

      border-radius: 8px;

      font-size: 10px;
      font-weight: 800;

      color: var(--primary-dark);
    }

    .product-info {
      padding: 17px;
    }

    .product-category {
      color: var(--primary);

      font-size: 10px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 0.7px;
    }

    .product-name {
      margin-top: 6px;

      font-size: 16px;
      font-weight: 750;
    }

    .product-description {
      margin-top: 6px;

      min-height: 38px;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.55;
    }

    .product-footer {
      margin-top: 16px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;
    }

    .price {
      font-size: 18px;
      font-weight: 850;
    }

    .add-btn {
      border: none;

      background: var(--primary);

      color: white;

      padding: 9px 12px;

      border-radius: 10px;

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .add-btn:hover {
      background: var(--primary-dark);
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid var(--border);

      padding: 30px 20px 40px;

      text-align: center;

      color: var(--muted);

      font-size: 12px;
    }

    footer strong {
      color: var(--text);
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      bottom: 20px;
      right: 20px;

      background: #111827;

      color: white;

      padding: 12px 15px;

      border-radius: 11px;

      font-size: 12px;
      font-weight: 700;

      opacity: 0;

      transform: translateY(12px);

      pointer-events: none;

      transition: 0.25s ease;

      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {
      .products {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .nav-links {
        display: none;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .hero-product {
        display: none;
      }
    }

    @media (max-width: 650px) {
      .nav {
        flex-wrap: wrap;
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .search {
        order: 3;
        flex-basis: 100%;
        max-width: none;
      }

      main {
        padding: 24px 16px 50px;
      }

      .hero {
        padding: 32px 25px;
        min-height: 370px;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .section-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="nav">

      <a href="#" class="brand">
        <span class="brand-logo">Z</span>
        <span>ZeroDown</span>
      </a>

      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#products">Shop</a>
        <a href="#">New arrivals</a>
      </nav>

      <div class="search">

        <span class="search-icon">⌕</span>

        <input
          id="searchInput"
          type="text"
          placeholder="Search products..."
        />

      </div>

      <div class="nav-actions">

        <button class="icon-btn" aria-label="Wishlist">
          ♡
        </button>

        <button class="icon-btn" aria-label="Cart">
          🛒
          <span id="cartCount">0</span>
        </button>

        <!-- Only deployment-related UI -->
        <div class="live-badge">

          <span class="live-dot"></span>

          <span id="liveVersion">
            LIVE · v1
          </span>

        </div>

      </div>

    </div>

  </header>

  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <!-- HERO -->

    <section class="hero">

      <div class="hero-content">

        <span class="hero-label" id="heroLabel">
          New arrivals
        </span>

        <h1 id="heroTitle">
          Things you use.
          <br />
          Designed better.
        </h1>

        <p id="heroDescription">
          A simple collection of everyday tech,
          workspace and lifestyle essentials.
        </p>

        <a href="#products" class="shop-btn">
          Shop collection →
        </a>

      </div>

      <div class="hero-product">

        <div
          class="hero-product-box"
          id="heroProduct"
        >
          🎧
        </div>

      </div>

    </section>

    <!-- PRODUCTS -->

    <section
      class="section"
      id="products"
    >

      <div class="section-header">

        <div>

          <h2>Featured products</h2>

          <p>
            Simple essentials for everyday use.
          </p>

        </div>

        <div class="categories">

          <button
            class="category-btn active"
            data-category="all"
          >
            All
          </button>

          <button
            class="category-btn"
            data-category="tech"
          >
            Tech
          </button>

          <button
            class="category-btn"
            data-category="workspace"
          >
            Workspace
          </button>

          <button
            class="category-btn"
            data-category="lifestyle"
          >
            Lifestyle
          </button>

        </div>

      </div>

      <div
        class="products"
        id="productGrid"
      ></div>

    </section>

  </main>

  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <strong>ZeroDown</strong>
    · Everyday essentials

  </footer>

  <div
    class="toast"
    id="toast"
  >
    Added to cart
  </div>

  <script>

    /*
      Product catalog used by the local demo.
      Version 2 contains a few updated products
      so the Blue -> Green deployment can be seen
      from the customer-facing page.
    */

    const productsByVersion = {

      v1: [
        {
          name: "Pulse Headphones",
          category: "tech",
          emoji: "🎧",
          price: "₹2,499",
          description: "Wireless headphones with 40 mm drivers."
        },

        {
          name: "Nova Watch",
          category: "tech",
          emoji: "⌚",
          price: "₹3,999",
          description: "AMOLED display with everyday activity tracking."
        },

        {
          name: "Urban Backpack",
          category: "lifestyle",
          emoji: "🎒",
          price: "₹1,899",
          description: "Compact everyday backpack with laptop storage."
        },

        {
          name: "Desk Lamp",
          category: "workspace",
          emoji: "💡",
          price: "₹1,299",
          description: "Three brightness levels for desk work."
        }
      ],

      v2: [
        {
          name: "Pulse Max Headphones",
          category: "tech",
          emoji: "🎧",
          price: "₹2,799",
          description: "Wireless headphones with improved battery life."
        },

        {
          name: "Nova Ultra Watch",
          category: "tech",
          emoji: "⌚",
          price: "₹4,499",
          description: "AMOLED smartwatch with GPS and activity tracking."
        },

        {
          name: "Urban Pro Backpack",
          category: "lifestyle",
          emoji: "🎒",
          price: "₹2,099",
          description: "Laptop backpack with padded compartments."
        },

        {
          name: "Desk Lamp X",
          category: "workspace",
          emoji: "💡",
          price: "₹1,499",
          description: "Adjustable desk lamp with four brightness levels."
        }
      ]

    };


    let currentVersion = "v1";
    let selectedCategory = "all";
    let cartCount = 0;


    const productGrid =
      document.getElementById("productGrid");

    const searchInput =
      document.getElementById("searchInput");

    const cartCountElement =
      document.getElementById("cartCount");

    const toast =
      document.getElementById("toast");


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts() {

      const products =
        productsByVersion[currentVersion] ||
        productsByVersion.v1;

      const searchText =
        searchInput.value
          .toLowerCase()
          .trim();

      const filteredProducts =
        products.filter(product => {

          const categoryMatch =
            selectedCategory === "all" ||
            product.category === selectedCategory;

          const searchMatch =
            product.name
              .toLowerCase()
              .includes(searchText);

          return categoryMatch && searchMatch;

        });


      productGrid.innerHTML =
        filteredProducts.map(product => {

          return `

            <article class="product-card">

              <div class="product-image">

                <span class="product-badge">
                  ${currentVersion === "v2"
                    ? "NEW"
                    : "POPULAR"}
                </span>

                ${product.emoji}

              </div>

              <div class="product-info">

                <div class="product-category">
                  ${product.category}
                </div>

                <div class="product-name">
                  ${product.name}
                </div>

                <div class="product-description">
                  ${product.description}
                </div>

                <div class="product-footer">

                  <div class="price">
                    ${product.price}
                  </div>

                  <button
                    class="add-btn"
                    onclick="addToCart('${product.name}')"
                  >
                    Add to cart
                  </button>

                </div>

              </div>

            </article>

          `;

        }).join("");


      if (!filteredProducts.length) {

        productGrid.innerHTML = `

          <div style="
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
          ">

            No products found.

          </div>

        `;

      }

    }


    /* =========================
       CART
    ========================= */

    function addToCart(productName) {

      cartCount++;

      cartCountElement.innerText =
        cartCount;

      toast.innerText =
        `${productName} added to cart`;

      toast.classList.add("show");

      setTimeout(() => {

        toast.classList.remove("show");

      }, 1800);

    }

    window.addToCart = addToCart;


    /* =========================
       APPLY VERSION
    ========================= */

    function applyVersion(version) {

      if (
        version !== "v1" &&
        version !== "v2"
      ) {
        version = "v1";
      }

      const changed =
        currentVersion !== version;

      currentVersion = version;


      /*
        v1 = blue theme
        v2 = green theme
      */

      document.body.classList.toggle(
        "green",
        currentVersion === "v2"
      );


      document.getElementById("liveVersion")
        .innerText =
        `LIVE · ${currentVersion}`;


      if (currentVersion === "v2") {

        document.getElementById("heroLabel")
          .innerText =
          "New arrivals";

        document.getElementById("heroTitle")
          .innerHTML =
          "Fresh products.<br />Ready for today.";

        document.getElementById("heroDescription")
          .innerText =
          "Browse the latest collection of everyday tech, workspace and lifestyle essentials.";

        document.getElementById("heroProduct")
          .innerText =
          "⌚";

      } else {

        document.getElementById("heroLabel")
          .innerText =
          "Popular picks";

        document.getElementById("heroTitle")
          .innerHTML =
          "Things you use.<br />Designed better.";

        document.getElementById("heroDescription")
          .innerText =
          "A simple collection of everyday tech, workspace and lifestyle essentials.";

        document.getElementById("heroProduct")
          .innerText =
          "🎧";

      }


      renderProducts();


      if (changed) {

        /*
          Small customer-facing confirmation
          when the currently served application
          version changes.
        */

        toast.innerText =
          `Store updated · ${currentVersion}`;

        toast.classList.add("show");

        setTimeout(() => {

          toast.classList.remove("show");

        }, 1800);

      }

    }


    /* =========================
       CHECK LIVE VERSION
    ========================= */

    async function checkVersion() {

      try {

        const response =
          await fetch(
            "/version",
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          return;
        }

        const data =
          await response.json();

        applyVersion(data.version);

      } catch (error) {

        /*
          Keep the existing page state if the
          version endpoint cannot be reached.
        */

      }

    }


    /* =========================
       SEARCH
    ========================= */

    searchInput.addEventListener(
      "input",
      renderProducts
    );


    /* =========================
       CATEGORIES
    ========================= */

    document
      .querySelectorAll(".category-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".category-btn")
              .forEach(item => {

                item.classList.remove("active");

              });

            button.classList.add("active");

            selectedCategory =
              button.dataset.category;

            renderProducts();

          }
        );

      });


    /* =========================
       INITIAL LOAD
    ========================= */

    renderProducts();

    checkVersion();


    /*
      Check the actual running
      application version every 2 seconds.

      This is what allows:

      LIVE · v1
            ↓
      Kubernetes Service switch
            ↓
      LIVE · v2
    */

    setInterval(
      checkVersion,
      2000
    );

  </script>

</body>
</html>
