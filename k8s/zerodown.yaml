apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerodown-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zerodown
      version: blue
  template:
    metadata:
      labels:
        app: zerodown
        version: blue
    spec:
      containers:
        - name: zerodown
          image: zerodown:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerodown-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zerodown
      version: green
  template:
    metadata:
      labels:
        app: zerodown
        version: green
    spec:
      containers:
        - name: zerodown
          image: zerodown:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: zerodown-service
spec:
  type: NodePort
  selector:
    app: zerodown
    version: blue
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080